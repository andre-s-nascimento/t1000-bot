# ============================================================
# application-dev.properties
# ------------------------------------------------------------
# Overrides para DEV LOCAL (máquina do desenvolvedor).
# Ativado via SPRING_PROFILES_ACTIVE=dev.
#
# FILOSOFIA:
#   1. O base (application.properties) aponta para classpath: — que
#      funciona em qualquer ambiente, mas não reflete o setup local
#      (arquivos em ./config/, paths absolutos, etc.).
#   2. Aqui sobrescrevemos o que é específico da máquina do dev.
#   3. NUNCA coloque secrets aqui. Use o .env (carregado pelo bootRun
#      em build.gradle) — este arquivo vai para o git.
# ============================================================

# ============================================================
# 1. PATHS DE JSON LOCAIS
# ============================================================
# O base usa classpath: (que resolve para src/main/resources/).
# Em dev, apontamos para ./config/ (raiz do repo) ou para paths
# absolutos, permitindo editar os JSONs sem recompilar.

# ----- Easter eggs / auto-responses / Copa -----
# Se você tem esses arquivos em ./config/ (raiz do repo), use file:./config/.
# Se prefere os do classpath (src/main/resources/), comente estas linhas.
# easter-egg.file=file:./config/easter-eggs.json
# auto.response.file=file:./config/auto-responses.json
# worldcup.data.file=file:./config/worldcup2026.json

# ----- Sala VIP (paths absolutos na máquina do dev) -----
salavip.data.file=file:/home/andre/dev/java/t1000-bot/config/sala-vip.json
salavip.config.file=file:/home/andre/dev/java/t1000-bot/config/salavip-config.json
t1000.salavip.config.file=file:/home/andre/dev/java/t1000-bot/config/salavip-config.json

# ============================================================
# 2. SEGURANÇA — pular OAuth2 do Google em dev
# ============================================================
# Em prod, application-prod.properties hardcoded false (falha segura).
# Em dev, não queremos fazer login a cada iteração do painel admin.
admin.security.disabled=true

# ============================================================
# 3. LOGGING — mais verboso, mas cirúrgico
# ============================================================
# Não coloque DEBUG no pacote inteiro (net.ddns.adambravo79.tmill=DEBUG)
# — gera ruído de LogSanitizer, clients HTTP, etc. Em vez disso,
# ativa DEBUG só no que interessa durante o desenvolvimento.

logging.level.net.ddns.adambravo79.tmill=INFO

# SQL + parâmetros do JdbcTemplate (útil para ver o que o ReminderRepository faz)
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# Repositórios e controllers (ver cada request/query)
logging.level.net.ddns.adambravo79.tmill.repository=DEBUG
logging.level.net.ddns.adambravo79.tmill.controller=DEBUG

# Reminders (recém-implementados — vale ver cada operação)
logging.level.net.ddns.adambravo79.tmill.service.ReminderService=DEBUG
logging.level.net.ddns.adambravo79.tmill.service.ReminderScheduler=DEBUG
logging.level.net.ddns.adambravo79.tmill.service.ReminderDispatcher=DEBUG
logging.level.net.ddns.adambravo79.tmill.service.ReminderBootstrapService=DEBUG

# ============================================================
# 4. TEMP DIR — /tmp para não sujar o workspace
# ============================================================
# Evita que ./temp/ (com áudios .oga/.wav) cresça no repo.
# Se você precisa inspecionar os áudios, comente esta linha.
app.temp.dir=/tmp/t1000-temp

# ============================================================
# 5. FLYWAY — permitir clean local (opcional)
# ============================================================
# Descomente SÓ se você usa ./gradlew flywayClean no fluxo de dev.
# O base deixa clean-disabled=true (default do Spring Boot) para
# evitar `clean` acidental. Em prod, application-prod.properties
# mantém clean-disabled=true hardcoded.
# spring.flyway.clean-disabled=false

# ============================================================
# 6. THYMELEAF — cache desligado (já é o default do base, explícito)
# ============================================================
spring.thymeleaf.cache=false
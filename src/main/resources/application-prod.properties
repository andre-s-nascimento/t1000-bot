# ============================================================
# OVERRIDES PARA PRODUÇÃO (OCI - servidor com poucos recursos)
# Ativado via SPRING_PROFILES_ACTIVE=prod no .env do servidor
# ============================================================

# ------------------------------------------------------------
# Tomcat — ainda mais restrito que o default de dev
# ------------------------------------------------------------
server.tomcat.threads.max=6
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=15
server.tomcat.accept-count=10

# ------------------------------------------------------------
# Hikari (Postgres) — pool menor em prod
# ------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ------------------------------------------------------------
# Flyway — nunca limpar schema em prod
# ------------------------------------------------------------
spring.flyway.clean-disabled=true

# ------------------------------------------------------------
# Logging — menos ruído em prod
# ------------------------------------------------------------
logging.level.net.ddns.adambravo79.tmill=INFO
logging.level.root=WARN
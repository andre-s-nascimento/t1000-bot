# ============================================================================
# application-prod.properties
# ----------------------------------------------------------------------------
# Overrides para PRODUÇÃO (OCI - servidor com poucos recursos).
# Ativado via SPRING_PROFILES_ACTIVE=prod.
#
# FILOSOFIA:
#   1. Todo @Value("${VAR}") crítico é RE-DECLARADO SEM DEFAULT.
#      → Se a variável não existir no ambiente, o Spring falha no boot
#        com "Could not resolve placeholder 'VAR'".
#      → Isso evita subir produção com "dummy-token" silenciosamente.
#
#   2. Recursos são mais restritos que em dev (Tomcat, Hikari, JVM).
#
#   3. Observabilidade é reduzida: sem Prometheus, apenas health/info.
#
#   4. Features experimentais são desligadas por padrão.
# ============================================================================

# ============================================================================
# 1. APLICAÇÃO
# ============================================================================
spring.threads.virtual.enabled=true
spring.main.lazy-initialization=false

# ============================================================================
# 2. SERVIDOR — ainda mais restrito que dev
# ============================================================================
server.tomcat.threads.max=6
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=15
server.tomcat.accept-count=10
server.tomcat.connection-timeout=120s

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.http-only=true

# ============================================================================
# 3. OBSERVABILIDADE — somente health e info em prod
# ============================================================================
management.endpoints.web.exposure.include=health,info

# ============================================================================
# 4. BANCOS DE DADOS — SEM DEFAULT (falha no boot se faltar)
# ============================================================================
spring.datasource.url=${POSTGRES_DATABASE_URL}
spring.datasource.username=${POSTGRES_DATABASE_USER}
spring.datasource.password=${POSTGRES_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true

spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false

# ============================================================================
# 5. KAFKA (Aiven) — SEM DEFAULT nos campos sensíveis
# ============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG}
spring.kafka.properties.ssl.truststore.location=${KAFKA_TRUSTSTORE_PATH}
spring.kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
spring.kafka.properties.ssl.truststore.type=${KAFKA_TRUSTSTORE_TYPE:JKS}

# ============================================================================
# 6. TELEGRAM — SEM DEFAULT (falha no boot se faltar)
# ============================================================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.owner.id=${TELEGRAM_OWNER_ID}

# ============================================================================
# 7. FEATURES / SERVIÇOS — SEM DEFAULT onde há secret ou ID crítico
# ============================================================================
auto.response.file=${AUTO_RESPONSE_FILE:file:/app/config/auto-responses.json}
easter-egg.file=${EASTER_EGG_FILE:file:/app/config/easter-eggs.json}

worldcup.enabled=${WORLD_CUP_ENABLED:false}
worldcup.data.file=${WORLD_CUP_FILE:file:/app/config/worldcup2026.json}
worldcup.update.enabled=${WORLDCUP_UPDATE_ENABLED:false}
worldcup.update.destination=${WORLDCUP_UPDATE_DESTINATION:/app/config/worldcup2026.json}

digest.enabled=${DIGEST_ENABLED:true}
digest.chat-ids=${DIGEST_ALLOWED_CHATS}

podcast.publish.chat-id=${PODCAST_PUBLISH_CHAT_ID}

weekly.reminder.media-file=${QUATRO_HORAS_QUARTA_FILE}

transcription.enabled=${TRANSCRIPTION_ENABLED:true}

# ============================================================================
# 8. INTEGRAÇÕES EXTERNAS — TODAS SEM DEFAULT
# ============================================================================
admin.google.client-id=${GOOGLE_CLIENT_ID}
admin.google.client-secret=${GOOGLE_CLIENT_SECRET}
admin.allowed-emails=${ADMIN_ALLOWED_EMAILS}
admin.allowed-ips=${ADMIN_ALLOWED_IPS}
admin.security.disabled=false

tmdb.token=${TMDB_READ_TOKEN}
streaming-availability.api.key=${STREAMING_AVAILABILITY_API_KEY}
watchmode.api.key=${WATCHMODE_API_KEY}
groq.api.key=${GROQ_API_KEY}
azure.speech.key=${AZURE_SPEECH_KEY}
azure.speech.region=${AZURE_SPEECH_REGION}

# ============================================================================
# 9. FEATURE FLAGS — persistência em volume (montado pelo deploy-oci.sh)
# ============================================================================
feature-flags.persist.enabled=true
feature-flags.persist.path=/app/config/feature-flags.json

# ============================================================================
# 10. THYMELEAF — cache ligado em prod (performance)
# ============================================================================
spring.thymeleaf.cache=true

# ============================================================================
# 11. LOGGING — menos ruído em prod
# ============================================================================
logging.level.root=WARN
logging.level.net.ddns.adambravo79.tmill=INFO

logging.level.io.ksilisk.telegrambot.core.strategy.impl.LoggingUpdateNoMatchStrategy=OFF
logging.level.io.ksilisk.telegrambot.longpolling.poller.DefaultUpdatePoller=ERROR
logging.level.io.ksilisk.telegrambot=WARN
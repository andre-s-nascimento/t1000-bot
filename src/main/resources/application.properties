# ============================================================
# ÍNDICE
# ============================================================
#  1. APLICAÇÃO (identidade, lazy, virtual threads, jackson)
#  2. SERVIDOR (Tomcat, cookies, actuator, management)
#  3. BANCOS DE DADOS
#     3.1 PostgreSQL
#     3.2 Flyway
#     3.3 MongoDB
#     3.4 SQLite (legado / migração)
#  4. CACHE
#  5. KAFKA
#  6. TELEGRAM
#  7. FEATURES / SERVIÇOS
#     7.1 Auto-response
#     7.2 Easter eggs
#     7.3 World Cup
#     7.4 Digest diário
#     7.5 Podcast semanal
#     7.6 Weekly reminder
#     7.7 Cache de transcrições
#     7.8 Migração SQLite → Postgres/Mongo
#  8. INTEGRAÇÕES EXTERNAS
#     8.1 Google OAuth2 / Admin
#     8.2 TMDB
#     8.3 Streaming Availability API
#     8.4 Watchmode
#     8.5 Groq
#     8.6 OpenAI (fallback local)
#     8.7 Azure TTS
#  9. DIRETÓRIOS E ARQUIVOS
# 10. LOGGING
# 11. DEV ONLY (perigoso em produção)
# ============================================================

# ============================================================
# 1. APLICAÇÃO
# ============================================================
spring.application.name=tmill-bot
spring.main.lazy-initialization=false
spring.jmx.enabled=false
spring.threads.virtual.enabled=true

# Jackson
spring.jackson.serialization.indent-output=false

# ============================================================
# 2. SERVIDOR
# ============================================================
server.address=0.0.0.0
server.port=8082
server.forward-headers-strategy=framework

# Cookies de sessão
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.http-only=true

# Tomcat (limitado para evitar picos de memória)
server.tomcat.max-connections=20
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=20
server.tomcat.connection-timeout=120s

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted

# ============================================================
# 3. BANCOS DE DADOS
# ============================================================

# ------------------------------------------------------------
# 3.1 PostgreSQL
# ------------------------------------------------------------
spring.datasource.url=${POSTGRES_DATABASE_URL}
spring.datasource.username=${POSTGRES_DATABASE_USER:postgres.mwhftshlktbvtnjqcixg}
spring.datasource.password=${POSTGRES_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Desativa a inicialização antiga (schema.sql)
spring.sql.init.mode=never

# Hikari (reduzido para dev)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.pool-name=TmillPool

# ------------------------------------------------------------
# 3.2 Flyway
# ------------------------------------------------------------
spring.flyway.enabled=true
# baseline-on-migrate permite rodar o Flyway num banco que já tenha tabelas
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------
# 3.3 MongoDB
# ------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI}
# Auto-index creation (útil para dev, desabilite em prod)
spring.data.mongodb.auto-index-creation=true

# ------------------------------------------------------------
# 3.4 SQLite (legado / migração)
# ------------------------------------------------------------
# spring.datasource.url=jdbc:sqlite:./data/t1000.db
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.sql.init.mode=never

migration.enabled=${MIGRATION_ENABLED:false}
migration.sqlite.path=${MIGRATION_SQLITE_PATH:./data/t1000.db}

# ============================================================
# 4. CACHE
# ============================================================
spring.cache.cache-names=movieDetails
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h
spring.cache.type=caffeine

# Cache de transcrições
cache.transcription.enabled=true
cache.transcription.ttl-seconds=86400

# ============================================================
# 5. KAFKA
# ============================================================
# ------------------------------------------------------------
# KAFKA (Aiven - SASL_SSL)
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
# Kafka Aiven - Truststore
spring.kafka.properties.ssl.truststore.location=${KAFKA_TRUSTSTORE_PATH}
spring.kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
spring.kafka.properties.ssl.truststore.type=JKS

# Propriedades de segurança (devem vir antes dos serializadores)
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_SASL_USERNAME}" password="${KAFKA_SASL_PASSWORD}";

#spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432

# Consumer
spring.kafka.consumer.group-id=t1000-audio-workers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=net.ddns.adambravo79.tmill.dto.AudioReceivedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.max-poll-records=10

# ============================================================
# 6. TELEGRAM
# ============================================================
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.polling.enabled=true
telegram.bot.polling.timeout=90
telegram.bot.polling.allowed-updates=message,callback_query,edited_message

# Timeouts do cliente OkHttp (aumentados para arquivos grandes)
telegram.bot.client.connect-timeout=300
telegram.bot.client.read-timeout=600
telegram.bot.client.write-timeout=600
telegram.bot.client.timeout=120s
telegram.bot.timeout=120s

telegram.message.limit=4000
telegram.owner.id=${TELEGRAM_OWNER_ID}
bot.allowed-chats=${BOT_ALLOWED_CHATS:}

# ============================================================
# 7. FEATURES / SERVIÇOS
# ============================================================

# ------------------------------------------------------------
# 7.1 Auto-response
# ------------------------------------------------------------
auto.response.enabled=true
auto.response.file=${AUTO_RESPONSE_FILE:classpath:auto-responses.json}
# Triggers que só respondem uma vez por dia por usuário (separados por vírgula)
auto.response.once-per-day-triggers=${AUTO_RESPONSE_ONCE_PER_DAY:bom dia}

# ------------------------------------------------------------
# 7.2 Easter eggs
# ------------------------------------------------------------
# Padrão local: classpath; produção sobrepõe com file:/app/config/easter-eggs.json
easter-egg.file=${EASTER_EGG_FILE:classpath:easter-eggs.json}

# ------------------------------------------------------------
# 7.3 World Cup
# ------------------------------------------------------------
worldcup.enabled=${WORLD_CUP_ENABLED:false}
worldcup.data.file=${WORLD_CUP_FILE:classpath:worldcup2026.json}

# Auto-update
worldcup.update.enabled=${WORLDCUP_UPDATE_ENABLED:false}
worldcup.update.url=https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json
worldcup.update.destination=${WORLDCUP_UPDATE_DESTINATION:/app/config/worldcup2026.json}
worldcup.update.cron=0 0 3 * * *

# ------------------------------------------------------------
# 7.4 Digest diário
# ------------------------------------------------------------
digest.enabled=true
digest.chat-ids=${DIGEST_ALLOWED_CHATS:}

# ------------------------------------------------------------
# 7.5 Podcast semanal
# ------------------------------------------------------------
podcast.schedule.cron=0 0 12 * * 5
podcast.target.user-id=5003155230
podcast.publish.chat-id=-${PODCAST_PUBLISH_CHAT_ID}
podcast.script.max-tokens=3000
podcast.retry.max-attempts=3
podcast.retry.delay-ms=5000
podcast.compress.timeout-seconds=180

# ------------------------------------------------------------
# 7.6 Weekly reminder
# ------------------------------------------------------------
#weekly.reminder.gif-url=${WEEKLY_REMINDER_GIF_URL:https://i.imgur.com/seu-gif.gif}
#weekly.reminder.video-file=/app/media/quatro-horas-de-quarta-feira.mp4
weekly.reminder.media-file=${QUATRO_HORAS_QUARTA_FILE:https://andre-s-nascimento.github.io/t1000-bot/videos/quatro-horas-de-quarta-feira.mp4}

# ------------------------------------------------------------
# 7.7 Transcrição (feature flag de áudio)
# ------------------------------------------------------------
t1000.features.transcription-enabled=${TRANSCRIPTION_ENABLED:false}
t1000.audio.max-size-mb=20

# ============================================================
# 8. INTEGRAÇÕES EXTERNAS
# ============================================================

# ------------------------------------------------------------
# 8.1 Google OAuth2 / Admin
# ------------------------------------------------------------
admin.google.client-id=${GOOGLE_CLIENT_ID:}
admin.google.client-secret=${GOOGLE_CLIENT_SECRET:}
admin.allowed-emails=${ADMIN_ALLOWED_EMAILS:}
# IP restriction (empty = allow all, dev mode)
admin.allowed-ips=${ADMIN_ALLOWED_IPS:}

# ------------------------------------------------------------
# 8.2 TMDB
# ------------------------------------------------------------
tmdb.token=${TMDB_READ_TOKEN}
tmdb.api.url=https://api.themoviedb.org/3
tmdb.connect-timeout=5s
tmdb.read-timeout=10s

# ------------------------------------------------------------
# 8.3 Streaming Availability API
# ------------------------------------------------------------
streaming-availability.api.host=streaming-availability.p.rapidapi.com
streaming-availability.api.key=${STREAMING_AVAILABILITY_API_KEY}

# ------------------------------------------------------------
# 8.4 Watchmode
# ------------------------------------------------------------
watchmode.api.key=${WATCHMODE_API_KEY}

# ------------------------------------------------------------
# 8.5 Groq
# ------------------------------------------------------------
groq.api.key=${GROQ_API_KEY}
groq.max-refinement-length=32000
groq.connect-timeout=5s
groq.read-timeout=120s

# Modelos (permite troca sem recompilar)
groq.model.transcription=whisper-large-v3
groq.model.refinement=openai/gpt-oss-20b
groq.model.digest=openai/gpt-oss-120b

# Limite de tokens para refinamento (saída)
groq.model.refinement.max-tokens=4000

# ------------------------------------------------------------
# 8.6 OpenAI (fallback local, não usado quando Groq está ativo)
# ------------------------------------------------------------
openai.api.url=http://localhost:10300/v1/audio/transcriptions
openai.api.key=sk-local-no-key-needed

# ------------------------------------------------------------
# 8.7 Azure TTS
# ------------------------------------------------------------
azure.speech.key=${AZURE_SPEECH_KEY}
azure.speech.region=${AZURE_SPEECH_REGION}

# ============================================================
# 9. DIRETÓRIOS E ARQUIVOS
# ============================================================
app.temp.dir=./temp
ajuste.debug.tts.save-ssml=false

ideas.log.directory=logs
user.log.directory=logs

# ============================================================
# 10. LOGGING
# ============================================================
logging.level.net.ddns.adambravo79.tmill=DEBUG

# Silencia log de "Handler for update not found" (edited_message, polls, etc.)
logging.level.io.ksilisk.telegrambot.core.strategy.impl.LoggingUpdateNoMatchStrategy=OFF

# Silencia log de timeout do poller (timeout é esperado no long polling;
# o poller faz retry automático e segue funcionando)
logging.level.io.ksilisk.telegrambot.longpolling.poller.DefaultUpdatePoller=ERROR

# Alternativas (descomente se precisar):
#logging.level.io.ksilisk.telegrambot.core.strategy.impl.LoggingUpdateNoMatchStrategy=OFF
logging.level.io.ksilisk.telegrambot=WARN

# ============================================================
# 11. DEV ONLY — NÃO USAR EM PRODUÇÃO
# ============================================================
# Desabilita Spring Security nos endpoints /admin/**
# NUNCA use `true` em produção. O SecurityConfig bloqueia o boot se estiver no profile `prod`.
admin.security.disabled=${ADMIN_SECURITY_DISABLED:false}
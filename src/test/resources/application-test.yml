# Variáveis de ambiente (em maiúsculas) para placeholders
TMDB_READ_TOKEN: dummy
TMDB_TOKEN: dummy
GROQ_API_KEY: dummy
WATCHMODE_API_KEY: dummy
TELEGRAM_BOT_TOKEN: dummy
TELEGRAM_OWNER_ID: 0
STREAMING_AVAILABILITY_API_KEY: dummy
PODCAST_PUBLISH_CHAT_ID: 123456789
AZURE_SPEECH_KEY: dummy
AZURE_SPEECH_REGION: dummy

# Propriedades normais (em minúsculas)
spring:
  threads:
    virtual:
      enabled: false
  application:
    name: tmill-bot-test
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092 # @DynamicPropertySource sobrescreve
    properties:
      # Zera as propriedades de segurança do application.properties
      security.protocol: PLAINTEXT
      ssl.truststore.location: ""
      ssl.truststore.password: ""
      ssl.truststore.type: ""
      ssl.keystore.location: ""
      ssl.keystore.password: ""
      ssl.keystore.type: ""
      sasl.mechanism: ""
      sasl.jaas.config: ""
      # Necessário para o consumer JSON
      spring.json.trusted.packages: "*"
      spring.json.value.default.type: net.ddns.adambravo79.tmill.dto.AudioReceivedEvent

    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

podcast:
  retry:
    max-attempts: 3
    delay-ms: 10 # rápido nos testes

telegram:
  bot:
    polling:
      enabled: false
    token: dummy
    username: test_bot
    owner:
      id: 0
  message:
    limit: 4000

groq:
  api:
    key: dummy
  model:
    transcription: whisper-large-v3
    refinement: llama-3.1-8b-instant
    digest: meta-llama/llama-4-scout-17b-16e-instruct
  max-prompt-length: 32000

# NOTE: We still need to override the azure properties because the main
# application.properties uses ${AZURE_SPEECH_KEY} placeholder syntax.
# The environment variables above (AZURE_SPEECH_KEY: dummy) should satisfy this.
# But to be extra safe, we can also override the property directly:
azure:
  speech:
    key: dummy
    region: dummy

tmdb:
  token: dummy
  api:
    url: http://localhost

watchmode:
  api:
    key: dummy

streaming-availability:
  api:
    key: dummy

admin:
  allowed-ips: 127.0.0.1

digest:
  enabled: false
  chat-ids: 123

bot:
  allowed-chats: -100123

worldcup:
  enabled: false
  data:
    file: worldcup2026.json
  update:
    enabled: false

cache:
  transcription:
    enabled: false
    ttl-seconds: 86400

auto:
  response:
    enabled: false
    file: auto-responses.json

easter-egg:
  file: easter-eggs.json

weekly:
  reminder:
    media-file: weekly-reminder.mp4

t1000:
  features:
    transcription-enabled: false
  audio:
    max-size-mb: 20

server:
  port: 8080

migration:
  enabled: false
  sqlite:
    path: ./data/test-migration.db

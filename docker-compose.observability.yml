services:
  prometheus:
    image: prom/prometheus:latest
    container_name: t1000-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d" # 👈 retenção 7 dias (não 15)
      - "--storage.tsdb.retention.size=1GB" # 👈 limite por tamanho
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: t1000-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana # ✅ persiste
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: t1000-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1G

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: t1000-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=256
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 512M

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: t1000-logstash
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m" # 👈 JVM heap: 256MB
      - "PIPELINE_WORKERS=1" # 👈 reduz threads
      - "PIPELINE_BATCH_SIZE=125" # 👈 batch menor
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logs:/usr/share/logstash/logs:ro # Mapeia a pasta de logs da sua app para dentro do container
    ports:
      - "5000:5000" # Porta para inputs TCP (opcional, mas útil)
    depends_on:
      - elasticsearch
    deploy:
      resources:
        limits:
          memory: 512M
volumes:
  es-data:
  prometheus-data:
  grafana-data:

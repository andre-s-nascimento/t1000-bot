name: Commitlint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install commitlint (frozen from lockfile)
        run: npm ci --ignore-scripts

      - name: Validate commits (PR only)
        if: github.event_name == 'pull_request'
        # 🔒 SEGURANÇA:
        #  - SHAs via env, não via ${{ }} dentro de run
        #  - ./node_modules/.bin/commitlint evita download on-demand
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./node_modules/.bin/commitlint --from="$BASE_SHA" --to="$HEAD_SHA" --verbose

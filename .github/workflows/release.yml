name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@48658d79b13b5d0ec71617c7a3275614f8e0fa50
        with:
          configurationJson: |
            {
              "categories": [
                { "title": "🚀 Features", "labels": ["enhancement"] },
                { "title": "🐛 Fixes", "labels": ["bug"] },
                { "title": "🧹 Refactor", "labels": ["refactor"] }
              ]
            }

      - name: Create Release
        uses: softprops/action-gh-release@d1e66170d32c9ec7bbcb7fae044d3d686ce304d3
        with:
          body: ${{ steps.changelog.outputs.changelog }}

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@e996d773a759f3d545d46a1b7f696c7be617051b
        with:
          configurationJson: |
            {
              "categories": [
                { "title": "🚀 Features", "labels": ["enhancement"] },
                { "title": "🐛 Fixes", "labels": ["bug"] },
                { "title": "🧹 Refactor", "labels": ["refactor"] }
              ]
            }

      - name: Create Release
        uses: softprops/action-gh-release@77fb938f2f95e717ce6705d2909af527263360a0
        with:
          body: ${{ steps.changelog.outputs.changelog }}

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 🆕 Permite disparo manual
    inputs:
      tag:
        description: "Tag para criar a release (ex: v2.6.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Determinar a tag
        id: vars
        run: |
          # Se for workflow_dispatch, usa o input; senão, usa a tag do push
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag selecionada: $TAG"

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@5c3139e57e0a839a57c53e6c836d48e51bcb91b2
        with:
          configurationJson: |
            {
              "categories": [
                { "title": "🚀 Features", "labels": ["enhancement"] },
                { "title": "🐛 Fixes", "labels": ["bug"] },
                { "title": "🧹 Refactor", "labels": ["refactor"] }
              ]
            }

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Create Release PR

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from branch name
        id: vars
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # BRANCH_NAME vem via env, não via '$ {{ }}' dentro de run
          VERSION=$(echo "$BRANCH_NAME" | sed -E 's/^release\/v?//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Versão extraída: $VERSION"

      - name: Coletar issues fechadas pelas features mergeadas na release
        id: issues
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # Lista PRs mergeados cuja base é esta branch de release
          # e extrai "Closes #N" / "Fixes #N" / "Resolves #N" do body.
          # O GitHub aceita close/closes/closed/fix/fixes/fixed/resolve/resolves/resolved
          ISSUES=$(gh pr list \
            --base "$BRANCH_NAME" \
            --state merged \
            --limit 100 \
            --json number,body \
            --jq '.[] | "\(.number)\t\(.body)"' \
            | grep -oiP '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+' \
            | grep -oP '\d+' \
            | sort -u \
            | tr '\n' ' ')

          echo "closed_issues=$ISSUES" >> "$GITHUB_OUTPUT"
          echo "📋 Issues que serão fechadas pela release: $ISSUES"

      - name: Create Pull Request to main
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.vars.outputs.version }}
          CLOSED_ISSUES: ${{ steps.issues.outputs.closed_issues }}
        run: |
          PR_TITLE="chore: release v${VERSION}"

          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          ## 🧾 Descrição

          Release da versão **v${VERSION}**.

          ## ✅ Checklist

          - [ ] Revisão aprovada
          - [ ] CI verde
          - [ ] Changelog atualizado
          - [ ] Sincronizar \`develop\` após o merge (automático)
          EOF

          # 🆕 Injeta "Closes #N" para cada issue coletada
          if [ -n "$CLOSED_ISSUES" ]; then
            echo "" >> "$BODY_FILE"
            echo "## 🔗 Issues resolvidas nesta release" >> "$BODY_FILE"
            echo "" >> "$BODY_FILE"
            for issue in $CLOSED_ISSUES; do
              echo "Closes #$issue" >> "$BODY_FILE"
            done
            echo "" >> "$BODY_FILE"
            echo "<!-- issues coletadas automaticamente dos PRs mergeados em $BRANCH_NAME -->" >> "$BODY_FILE"
          fi

          # Verifica se o PR já existe
          EXISTING_PR=$(gh pr list \
            --base main \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR #$EXISTING_PR já existe para $BRANCH_NAME → main"
            # 🆕 Atualiza o body do PR existente com as issues coletadas
            if [ -n "$CLOSED_ISSUES" ]; then
              EXISTING_BODY=$(gh pr view "$EXISTING_PR" --json body --jq '.body')
              if ! echo "$EXISTING_BODY" | grep -q "Issues resolvidas nesta release"; then
                {
                  echo "$EXISTING_BODY"
                  echo ""
                  echo "## 🔗 Issues resolvidas nesta release"
                  echo ""
                  for issue in $CLOSED_ISSUES; do
                    echo "Closes #$issue"
                  done
                } > "$BODY_FILE"
                gh pr edit "$EXISTING_PR" --body-file "$BODY_FILE"
                echo "✏️ Body do PR #$EXISTING_PR atualizado com as issues"
              fi
            fi
          else
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "$PR_TITLE" \
              --body-file "$BODY_FILE" \
              --label "release"
          fi

          rm -f "$BODY_FILE"

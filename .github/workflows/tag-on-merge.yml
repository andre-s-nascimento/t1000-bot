name: Tag on Main Merge

on:
  push:
    branches:
      - main

jobs:
  create-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Merge pull request')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from merge commit message
        id: vars
        run: |
          PR_TITLE=$(git log -1 --pretty=%s)
          VERSION=$(echo "$PR_TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sed 's/v//' || echo "")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.vars.outputs.version != ''
        run: |
          if git rev-parse "v${{ steps.vars.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.vars.outputs.version }} já existe. Nada a fazer."
          else
            git tag -a "v${{ steps.vars.outputs.version }}" -m "Release v${{ steps.vars.outputs.version }}"
            git push origin "v${{ steps.vars.outputs.version }}"
          fi

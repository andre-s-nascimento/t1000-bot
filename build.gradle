plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id "com.diffplug.spotless" version "6.25.0"
    id "org.sonarqube" version "7.3.1.8318"
}

group = 'net.ddns.adambravo79'
version = '2.5.4'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
    // Repositório obrigatório para o SDK de Fala da Azure
    maven {
        url "https://azureai.azureedge.net/maven/"
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'   

    implementation 'org.springframework.security:spring-security-core:7.1.1'
    implementation 'org.springframework.security:spring-security-web:7.1.1'
    implementation 'org.springframework.security:spring-security-config:7.1.1'
    implementation 'org.springframework.security:spring-security-crypto:7.1.1'
    implementation 'org.springframework.security:spring-security-oauth2-core:7.1.1'
    implementation 'org.springframework.security:spring-security-oauth2-client:7.1.1'
    implementation 'org.springframework.security:spring-security-oauth2-jose:7.1.1'
        
    // define a BOM and its version
    implementation(platform("com.squareup.okhttp3:okhttp-bom:5.4.0"))
    // define any required OkHttp artifacts without version
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")

    // Cache
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'

    // SQLite
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'

    // Reactor (para async)
    implementation 'io.projectreactor:reactor-core:3.7.0'

    // FFmpeg wrapper
    implementation 'net.bramp.ffmpeg:ffmpeg:0.8.0'

    // ========== TELEGRAM (substituição) ==========
    implementation 'io.github.ksilisk:telegram-bot-spring-boot-starter:0.7.0'

    // (Opcional) Se precisar de modelos específicos, o starter já inclui o meta-client.
    // Mas para evitar ambiguidades, você pode forçar a versão:
    implementation 'org.telegram:telegrambots-meta:6.9.7.1'

    // ========== Azure Speech SDK (para TTS) ==========
    // SDK oficial da Microsoft para Java (TTS, STT, etc.)
    implementation 'com.azure:azure-core:1.54.1'  

    // HTML
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Drivers para migração futura (Postgres e Mongo)
    // Driver do PostgreSQL
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // Observabilidade - Sprint 3
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    //implementation 'net.logstash.logback:logstash-logback-encoder'
    // Source: https://mvnrepository.com/artifact/net.logstash.logback/logstash-logback-encoder
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Testes
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.awaitility:awaitility:4.2.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.4.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver3-junit5:5.4.0'
    
    // Testcontainers Core & Modules
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-mongodb'
    testImplementation 'commons-io:commons-io:2.22.0'
}

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
        force 'commons-io:commons-io:2.22.0'
    }
}

// Spotless (configuração mantida)
tasks.withType(com.diffplug.gradle.spotless.SpotlessTask).configureEach {
    notCompatibleWithConfigurationCache("Spotless has compatibility issues with configuration cache")
}

// Configuração do SonarCloud
sonar {
    properties {
        property "sonar.projectKey", "andre-s-nascimento_t1000-bot"
        property "sonar.organization", "andre-s-nascimento"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.exclusions", "**/build/**,**/src/test/**"
        property "sonar.java.source", "21"
    }
}

tasks.withType(JavaCompile) {
    options.fork = true
    options.forkOptions.memoryMaximumSize = '256m'
}

jacoco {
    toolVersion = "0.8.11"
}

test {
    useJUnitPlatform()
    systemProperty 'user.timezone', 'America/Sao_Paulo'

    // Todas as variáveis sem default no application.properties
    // (o YAML de test NÃO resolve ${VAR} — só o ambiente resolve)
    environment 'TELEGRAM_BOT_TOKEN',        System.getenv('TELEGRAM_BOT_TOKEN')        ?: 'dummy-token'
    environment 'TELEGRAM_BOT_USERNAME',     System.getenv('TELEGRAM_BOT_USERNAME')     ?: 'test_bot'
    environment 'TELEGRAM_OWNER_ID',         System.getenv('TELEGRAM_OWNER_ID')         ?: '0'
    environment 'GROQ_API_KEY',              System.getenv('GROQ_API_KEY')              ?: 'dummy'
    environment 'TMDB_READ_TOKEN',           System.getenv('TMDB_READ_TOKEN')           ?: 'dummy'
    environment 'WATCHMODE_API_KEY',         System.getenv('WATCHMODE_API_KEY')         ?: 'dummy'
    environment 'STREAMING_AVAILABILITY_API_KEY', System.getenv('STREAMING_AVAILABILITY_API_KEY') ?: 'dummy'
    environment 'AZURE_SPEECH_KEY',          System.getenv('AZURE_SPEECH_KEY')          ?: 'dummy'
    environment 'AZURE_SPEECH_REGION',       System.getenv('AZURE_SPEECH_REGION')       ?: 'brazilsouth'
    environment 'PODCAST_PUBLISH_CHAT_ID',   System.getenv('PODCAST_PUBLISH_CHAT_ID')   ?: '123456789'
    environment 'POSTGRES_DATABASE_URL',     System.getenv('POSTGRES_DATABASE_URL')     ?: 'jdbc:postgresql://localhost:5432/test'
    environment 'POSTGRES_DATABASE_USER',    System.getenv('POSTGRES_DATABASE_USER')    ?: 'test'
    environment 'POSTGRES_DATABASE_PASSWORD',System.getenv('POSTGRES_DATABASE_PASSWORD')?: 'test'
    environment 'MONGODB_URI',               System.getenv('MONGODB_URI')               ?: 'mongodb://localhost:27017/test'
    environment 'KAFKA_BOOTSTRAP_SERVERS',   System.getenv('KAFKA_BOOTSTRAP_SERVERS')   ?: 'localhost:9092'

    testLogging {
        events "skipped", "failed"
        showStandardStreams = false
        exceptionFormat = "full"
    }

    finalizedBy jacocoTestReport
}

tasks.register('unitTest', Test) {
    group = 'verification'
    description = 'Roda apenas testes unitários (sem Testcontainers)'
    useJUnitPlatform()
    systemProperty 'user.timezone', 'America/Sao_Paulo'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        excludeTestsMatching "net.ddns.adambravo79.tmill.integration.*"
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'net/ddns/adambravo79/tmill/client/**',
                'net/ddns/adambravo79/tmill/config/**',
                'net/ddns/adambravo79/tmill/TmillApplication*'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit { minimum = 0.40 }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.35.0').aosp().reflowLongStrings().formatJavadoc(false).reorderImports(false).groupArtifact('com.google.googlejavaformat:google-java-format') 
        removeUnusedImports()
        importOrder('java', 'javax', 'org', 'com', '')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named("check") {
    dependsOn("spotlessCheck")
}

tasks.named("sonar") {
    dependsOn("jacocoTestReport")
}

tasks.named('bootRun') {
    notCompatibleWithConfigurationCache("Carrega variáveis do .env")
    
    def envFile = project.file('.env')
    if (envFile.exists()) {
        def envVars = envFile.readLines()
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') && it.contains('=') }
                .collect { 
                    // remove "export " se existir, e trata aspas
                    def line = it.replaceFirst(/^export\s+/, '')
                    def (key, value) = line.split('=', 2)
                    value = value.trim()
                    // remove aspas simples/duplas envolventes
                    if ((value.startsWith('"') && value.endsWith('"')) ||
                        (value.startsWith("'") && value.endsWith("'"))) {
                        value = value.substring(1, value.length() - 1)
                    }
                    // remove comentário inline (só se não estiver entre aspas — simplificado)
                    [key.trim(), value]
                }
                .collectEntries { [it[0], it[1]] }
        
        environment(envVars)
        logger.lifecycle("✅ Carregadas ${envVars.size()} variáveis do .env")
    } else {
        logger.lifecycle("⚠️ Arquivo .env não encontrado — usando variáveis de ambiente do sistema")
    }
    
    jvmArgs = [
        '-Xmx512m',
        '-XX:MaxMetaspaceSize=192m',
        '-XX:+UseG1GC',
        '-XX:MaxGCPauseMillis=200'
    ]
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/dependencies"
}
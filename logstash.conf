# logstash.conf
input {
  # Lê o arquivo de log JSON gerado pela sua aplicação
  file {
    path => "/usr/share/logstash/logs/t1000-bot.json"
    start_position => "beginning"
    sincedb_path => "/dev/null" # Para desenvolvimento, para reler o arquivo do zero
    codec => "json" # Diz ao Logstash que o arquivo já está em formato JSON
  }
}

filter {
  # Nenhum filtro é necessário, pois o log já está em JSON
  # O Logstash irá automaticamente parsear os campos.
}

output {
  # Envia os dados para o Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "t1000-logs-%{+YYYY.MM.dd}" # Cria um índice por dia
  }
  # Opcional: imprime no console do Logstash para debug
  stdout { codec => rubydebug }
}